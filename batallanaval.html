<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Batalla Naval — Los Juegos de Omega</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet"/>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: #f0ecf7;
  --bg2: #ffffff;
  --morado: #7018cc;
  --morado2: #8f2de8;
  --naranja: #e85e00;
  --verde: #0d8a4a;
  --rojo: #d41230;
  --texto: #1a0a2e;
  --texto2: #5a4070;
  --border: rgba(130,36,227,0.2);
  --font: 'Orbitron', sans-serif;
  --mono: 'Montserrat', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; background: var(--bg); color: var(--texto); font-family: var(--mono); font-weight: 700; }

.header { background: #000; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; }
.header h1 { font-family: var(--font); font-size: 16px; letter-spacing: 1px; flex: 1; }
.header .equipo-tag { font-size: 12px; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 6px; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }

button { font-family: var(--mono); font-weight: 800; cursor: pointer; border: none; border-radius: 8px; }
input, select { font-family: var(--mono); font-weight: 700; border: 1px solid var(--border); border-radius: 8px; padding: 10px; width: 100%; background: #fff; color: var(--texto); }

.btn { padding: 12px 18px; font-size: 13px; }
.btn-morado { background: var(--morado); color: #fff; }
.btn-naranja { background: var(--naranja); color: #fff; }
.btn-verde { background: var(--verde); color: #fff; }
.btn-rojo { background: var(--rojo); color: #fff; }
.btn-ghost { background: #ede8f8; color: var(--morado); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 20px; }
.card h2 { font-family: var(--font); font-size: 15px; color: var(--morado); margin-bottom: 16px; letter-spacing: 1px; }

.screen { display: none; }
.screen.active { display: block; }

/* ===== CONFIG / SELECCIÓN ===== */
.equipos-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 560px; margin: 0 auto; }
.captain-picks { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 560px; margin: 0 auto; }
.captain-picks button { padding: 28px 16px; font-size: 16px; }

/* ===== TABLEROS ===== */
.boards-row { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
.board-block { text-align: center; }
.board-block h3 { font-family: var(--font); font-size: 13px; margin-bottom: 10px; letter-spacing: 1px; }
.board { display: inline-grid; grid-template-columns: 28px repeat(8, 42px); gap: 3px; }
.cell { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; border-radius: 4px; }
.cell.head { background: transparent; color: var(--texto2); font-size: 11px; }
.cell.mar { background: #ede8f8; border: 1px solid var(--border); color: var(--morado); cursor: default; }
.cell.mar.clickable { cursor: pointer; }
.cell.mar.clickable:hover { background: rgba(130,36,227,0.2); }
.cell.barco { background: var(--morado); color: #fff; }
.cell.agua { background: #d7e8ff; border: 1px solid #9cc3f0; color: #2563a8; }
.cell.tocado { background: #ffd9dc; border: 1px solid var(--rojo); color: var(--rojo); }
.cell.hundido { background: #2b2b2b; color: #ff6b6b; border: 1px solid #000; }
.cell.barco.tocado { background: #7a0f22; color: #fff; }
.cell.barco.hundido { background: #000; color: #ff3b3b; }

.pending-info { margin: 14px 0; font-size: 13px; color: var(--texto2); text-align: center; }
.turno-banner { text-align: center; font-family: var(--font); font-size: 16px; padding: 10px; border-radius: 8px; margin-bottom: 18px; }
.turno-banner.mio { background: #dcf5e6; color: var(--verde); }
.turno-banner.rival { background: #f3eeff; color: var(--morado); }

.overlay { position: fixed; inset: 0; background: rgba(8,1,15,0.94); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 500; }
.overlay.show { display: flex; }
.overlay .titulo { font-family: var(--font); font-size: 18px; color: var(--naranja); letter-spacing: 4px; }
.overlay .ganador { font-family: var(--font); font-size: 56px; color: #fff; text-shadow: 0 0 40px var(--naranja); text-align: center; }

.orient-toggle { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.orient-toggle button { padding: 8px 16px; font-size: 12px; }
.orient-toggle button.activo { background: var(--morado); color: #fff; }
.orient-toggle button:not(.activo) { background: #ede8f8; color: var(--morado); }
</style>
</head>
<body>

<div class="header">
  <h1>⚓ BATALLA NAVAL — Los Juegos de Omega</h1>
  <div class="equipo-tag" id="equipo-tag" style="display:none;"></div>
</div>

<div class="wrap">

  <!-- CONFIGURAR PARTIDA -->
  <div class="screen active" id="pantalla-config">
    <div class="card">
      <h2>Nueva partida</h2>
      <div class="equipos-form">
        <div>
          <label style="display:block;font-size:11px;font-weight:800;margin-bottom:4px;">Nombre Equipo A</label>
          <input type="text" id="nombre-equipo-a" value="Equipo Rojo" />
        </div>
        <div>
          <label style="display:block;font-size:11px;font-weight:800;margin-bottom:4px;">Nombre Equipo B</label>
          <input type="text" id="nombre-equipo-b" value="Equipo Azul" />
        </div>
      </div>
      <button class="btn btn-naranja" style="width:100%;max-width:560px;display:block;margin:18px auto 0;" onclick="crearPartida()">Crear partida</button>
    </div>
  </div>

  <!-- ELEGIR CAPITÁN -->
  <div class="screen" id="pantalla-seleccion">
    <div class="card">
      <h2>¿Quién eres?</h2>
      <div class="captain-picks">
        <button class="btn btn-morado" id="btn-elegir-a" onclick="elegirCapitan('A')"></button>
        <button class="btn btn-morado" id="btn-elegir-b" onclick="elegirCapitan('B')"></button>
      </div>
    </div>
  </div>

  <!-- COLOCACIÓN DE FLOTA -->
  <div class="screen" id="pantalla-colocacion">
    <div class="card">
      <h2 id="colocacion-titulo">Coloca tu flota</h2>
      <div class="orient-toggle">
        <button id="btn-orient-h" class="activo" onclick="setOrientacion('H')">↔ Horizontal</button>
        <button id="btn-orient-v" onclick="setOrientacion('V')">↕ Vertical</button>
      </div>
      <div class="boards-row">
        <div class="board-block">
          <div class="board" id="board-colocacion"></div>
        </div>
      </div>
      <div class="pending-info" id="colocacion-info"></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;">
        <button class="btn btn-ghost" onclick="deshacerUltimoBarco()">Deshacer último barco</button>
        <button class="btn btn-ghost" onclick="reiniciarColocacion()">Reiniciar colocación</button>
        <button class="btn btn-verde" id="btn-confirmar-flota" style="display:none;" onclick="confirmarFlota()">Confirmar flota</button>
      </div>
      <div class="pending-info" id="colocacion-espera" style="display:none;">✅ Flota confirmada. Esperando al capitán rival...</div>
    </div>
  </div>

  <!-- BATALLA -->
  <div class="screen" id="pantalla-batalla">
    <div class="turno-banner" id="turno-banner"></div>
    <div id="sorteo-bar" style="display:none;text-align:center;margin-bottom:18px;">
      <button class="btn btn-naranja" onclick="sortearInicio()">🎲 Sortear quién empieza</button>
    </div>
    <div class="boards-row">
      <div class="board-block">
        <h3>🛡️ TU FLOTA</h3>
        <div class="board" id="board-flota"></div>
      </div>
      <div class="board-block">
        <h3>🎯 TABLERO DE ATAQUE</h3>
        <div class="board" id="board-ataque"></div>
      </div>
    </div>
  </div>

  <!-- FIN -->
  <div class="screen" id="pantalla-fin">
    <div class="card" style="text-align:center;">
      <h2>Partida terminada</h2>
      <div id="fin-resultado" style="font-family:var(--font);font-size:22px;color:var(--naranja);margin:16px 0;"></div>
      <button class="btn btn-morado" onclick="volverAConfig()">Nueva partida</button>
    </div>
  </div>

  <!-- ESPECTADOR (Panel Central): ambos tableros a la vez, solo lectura -->
  <div class="screen" id="pantalla-espectador">
    <div class="turno-banner" id="espectador-banner"></div>
    <div class="boards-row">
      <div class="board-block">
        <h3 id="espectador-nombre-a">EQUIPO A</h3>
        <div class="board" id="board-espectador-a"></div>
      </div>
      <div class="board-block">
        <h3 id="espectador-nombre-b">EQUIPO B</h3>
        <div class="board" id="board-espectador-b"></div>
      </div>
    </div>
  </div>

</div>

<div class="overlay" id="overlay-evento">
  <div class="titulo" id="overlay-titulo">DISPARO</div>
  <div class="ganador" id="overlay-texto">—</div>
</div>

<script>
/* ===== FIREBASE ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAQjPK6bdZurVNRlj7PI6Suu9jRHQ6ycFk",
  authDomain: "los-juegos-de-omega.firebaseapp.com",
  projectId: "los-juegos-de-omega",
  storageBucket: "los-juegos-de-omega.firebasestorage.app",
  messagingSenderId: "602888359633",
  appId: "1:602888359633:web:bfc738d469ad95fe37fff0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const TS = firebase.firestore.FieldValue.serverTimestamp;
const partidaRef = db.collection("batalla_naval").doc("partida_actual");

/* ===== VOZ (misma configuración que el resto de la suite) ===== */
let vozSeleccionada = null;
function initVoz() {
  const cargar = () => {
    const voces = window.speechSynthesis.getVoices();
    if (!voces.length) return;
    vozSeleccionada =
      voces.find(v => v.name === "Google español") ||
      voces.find(v => v.name.includes("Google") && v.lang === "es-ES") ||
      voces.find(v => v.name.includes("Google") && v.lang.startsWith("es")) ||
      voces.find(v => v.name.includes("Helena")) ||
      voces.find(v => v.name.includes("Pablo")) ||
      voces.find(v => v.name.includes("Mónica")) ||
      voces.find(v => v.name.includes("Monica")) ||
      voces.find(v => v.lang === "es-ES") ||
      voces.find(v => v.lang.startsWith("es")) ||
      voces[0] || null;
  };
  window.speechSynthesis.onvoiceschanged = cargar;
  cargar();
  setTimeout(cargar, 500);
  setTimeout(cargar, 1500);
}
function hablar(frases) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  frases.forEach((f, i) => {
    const msg = new SpeechSynthesisUtterance(f);
    msg.lang = "es-ES";
    msg.rate = i === frases.length - 1 ? 0.85 : 0.95;
    msg.pitch = i === frases.length - 1 ? 0.9 : 1.0;
    msg.volume = 1;
    if (vozSeleccionada) msg.voice = vozSeleccionada;
    window.speechSynthesis.speak(msg);
  });
}

/* ===== CONSTANTES DE JUEGO ===== */
const LETRAS = ['A','B','C','D','E','F','G','H'];
const FLOTA_CONFIG = [3, 3, 2, 2, 2, 1, 1]; // 2x3 + 3x2 + 2x1 = 7 barcos, 14 casillas

function coordId(fila, col) { return LETRAS[col] + (fila + 1); }

/* ===== ESTADO LOCAL ===== */
let miEquipo = null; // 'A' | 'B'
let ultimaPartida = null;
let primerSnapPartida = true;
let ultimoEventoKey = null;
let yaTransicionoFase = false;

// Colocación (local hasta confirmar)
let orientacion = 'H';
let barcosColocados = []; // [{celdas:["A1","A2","A3"]}]

function barcoActualIndex() { return barcosColocados.length; }
function barcoActualLongitud() { return FLOTA_CONFIG[barcoActualIndex()]; }

/* ===== NAVEGACIÓN DE PANTALLAS ===== */
const modoEspectador = new URLSearchParams(location.search).get("espectador") === "1";

function mostrarPantalla(id) {
  ['pantalla-config','pantalla-seleccion','pantalla-colocacion','pantalla-batalla','pantalla-fin','pantalla-espectador'].forEach(p => {
    document.getElementById(p).classList.toggle('active', p === id);
  });
}

/* ===== CREAR PARTIDA ===== */
async function crearPartida() {
  const nombreA = document.getElementById("nombre-equipo-a").value.trim();
  const nombreB = document.getElementById("nombre-equipo-b").value.trim();
  if (!nombreA || !nombreB) { alert("Pon el nombre de los dos equipos"); return; }
  if (ultimaPartida && ultimaPartida.fase && ultimaPartida.fase !== 'terminada') {
    if (!confirm("Ya hay una partida en curso. ¿Seguro que quieres empezar una nueva? Se perderá la actual.")) return;
  }
  await partidaRef.set({
    equipoA: nombreA,
    equipoB: nombreB,
    fase: 'colocacion',
    flotaA: [],
    flotaB: [],
    disparosRecibidosA: {},
    disparosRecibidosB: {},
    listoA: false,
    listoB: false,
    turno: null,
    ganador: null,
    ultimoEvento: null,
    creado_en: TS()
  });
  miEquipo = null;
  yaTransicionoFase = false;
  mostrarPantalla('pantalla-seleccion');
}

function volverAConfig() {
  document.getElementById("nombre-equipo-a").value = "Equipo Rojo";
  document.getElementById("nombre-equipo-b").value = "Equipo Azul";
  miEquipo = null;
  document.getElementById("equipo-tag").style.display = "none";
  mostrarPantalla('pantalla-config');
}

/* ===== ELEGIR CAPITÁN ===== */
function elegirCapitan(letra) {
  miEquipo = letra;
  barcosColocados = [];
  orientacion = 'H';
  const nombre = letra === 'A' ? ultimaPartida.equipoA : ultimaPartida.equipoB;
  const tag = document.getElementById("equipo-tag");
  tag.textContent = "Capitán · " + nombre;
  tag.style.display = "inline-block";
  renderTodo();
}

/* ===== COLOCACIÓN DE FLOTA ===== */
function setOrientacion(o) {
  orientacion = o;
  document.getElementById("btn-orient-h").classList.toggle("activo", o === 'H');
  document.getElementById("btn-orient-v").classList.toggle("activo", o === 'V');
}

function celdasParaBarco(filaIni, colIni, longitud, orient) {
  const celdas = [];
  for (let i = 0; i < longitud; i++) {
    const fila = orient === 'V' ? filaIni + i : filaIni;
    const col = orient === 'H' ? colIni + i : colIni;
    if (fila > 7 || col > 7) return null; // se sale del tablero
    celdas.push(coordId(fila, col));
  }
  return celdas;
}

function intentarColocar(fila, col) {
  if (barcoActualIndex() >= FLOTA_CONFIG.length) return; // ya están los 7 colocados
  const longitud = barcoActualLongitud();
  const celdas = celdasParaBarco(fila, col, longitud, orientacion);
  if (!celdas) { mostrarToastColocacion("Ese barco no cabe ahí, se sale del tablero"); return; }
  const ocupadas = new Set(barcosColocados.flatMap(b => b.celdas));
  if (celdas.some(c => ocupadas.has(c))) { mostrarToastColocacion("Ahí ya hay otro barco"); return; }
  barcosColocados.push({ celdas });
  renderColocacion();
}

function mostrarToastColocacion(msg) {
  const info = document.getElementById("colocacion-info");
  info.textContent = msg;
  info.style.color = "var(--rojo)";
  setTimeout(() => { info.style.color = "var(--texto2)"; renderColocacionInfo(); }, 1800);
}

function deshacerUltimoBarco() {
  barcosColocados.pop();
  renderColocacion();
}

function reiniciarColocacion() {
  barcosColocados = [];
  renderColocacion();
}

async function confirmarFlota() {
  if (barcosColocados.length < FLOTA_CONFIG.length) return;
  const campo = miEquipo === 'A' ? 'flotaA' : 'flotaB';
  const listoCampo = miEquipo === 'A' ? 'listoA' : 'listoB';
  await partidaRef.update({
    [campo]: barcosColocados.map(b => ({ celdas: b.celdas, impactos: 0 })),
    [listoCampo]: true
  });
}

function renderColocacionInfo() {
  const info = document.getElementById("colocacion-info");
  const idx = barcoActualIndex();
  if (idx >= FLOTA_CONFIG.length) {
    info.textContent = "¡Flota completa! Pulsa \"Confirmar flota\" cuando estés listo.";
  } else {
    const longitud = FLOTA_CONFIG[idx];
    info.textContent = `Coloca el barco ${idx + 1} de ${FLOTA_CONFIG.length} (${longitud} casilla${longitud>1?'s':''}) — clic en la casilla inicial`;
  }
}

function renderColocacion() {
  const board = document.getElementById("board-colocacion");
  const ocupadas = new Set(barcosColocados.flatMap(b => b.celdas));
  board.innerHTML = renderBoardHTML({
    marcarBarco: (id) => ocupadas.has(id),
    onClickCell: barcoActualIndex() < FLOTA_CONFIG.length ? 'intentarColocar' : null
  });
  renderColocacionInfo();
  document.getElementById("btn-confirmar-flota").style.display = barcosColocados.length >= FLOTA_CONFIG.length ? 'inline-block' : 'none';
}

/* ===== RENDER GENÉRICO DE TABLERO 8x8 ===== */
function renderBoardHTML(opts) {
  // opts: { marcarBarco(id), marcarDisparo(id) -> 'agua'|'tocado'|'hundido'|null, onClickCell: nombreFuncionOrNull }
  let html = `<div class="cell head"></div>`;
  LETRAS.forEach(l => html += `<div class="cell head">${l}</div>`);
  for (let fila = 0; fila < 8; fila++) {
    html += `<div class="cell head">${fila + 1}</div>`;
    for (let col = 0; col < 8; col++) {
      const id = coordId(fila, col);
      let cls = 'cell mar';
      const esBarco = opts.marcarBarco ? opts.marcarBarco(id) : false;
      const disparo = opts.marcarDisparo ? opts.marcarDisparo(id) : null;
      if (esBarco) cls += ' barco';
      if (disparo) cls += ' ' + disparo;
      const clickAttr = opts.onClickCell ? ` clickable" onclick="${opts.onClickCell}(${fila},${col})` : '"';
      html += `<div class="${cls}${opts.onClickCell ? ' clickable' : ''}" ${opts.onClickCell ? `onclick="${opts.onClickCell}(${fila},${col})"` : ''}>${disparo === 'tocado' ? '✕' : disparo === 'hundido' ? '☠' : disparo === 'agua' ? '•' : ''}</div>`;
    }
  }
  return html;
}

/* ===== BATALLA ===== */
async function sortearInicio() {
  try {
    await db.runTransaction(async (tx) => {
      const doc = await tx.get(partidaRef);
      const d = doc.data();
      if (d.turno) return; // ya decidido por el otro capitán
      const elegido = Math.random() < 0.5 ? 'A' : 'B';
      tx.update(partidaRef, {
        turno: elegido,
        ultimoEvento: { tipo: 'inicio', equipoLetra: elegido, ts: TS() }
      });
    });
  } catch(e) { console.error(e); }
}

async function disparar(fila, col) {
  if (!ultimaPartida || ultimaPartida.fase !== 'batalla' || ultimaPartida.turno !== miEquipo) return;
  const coord = coordId(fila, col);
  try {
    await db.runTransaction(async (tx) => {
      const doc = await tx.get(partidaRef);
      const d = doc.data();
      if (d.fase !== 'batalla' || d.turno !== miEquipo) return;
      const targetLetra = miEquipo === 'A' ? 'B' : 'A';
      const disparosKey = 'disparosRecibidos' + targetLetra;
      const disparosRecibidos = Object.assign({}, d[disparosKey] || {});
      if (disparosRecibidos[coord]) return; // ya se disparó ahí antes
      const flotaKey = 'flota' + targetLetra;
      const flota = (d[flotaKey] || []).map(b => ({ celdas: b.celdas, impactos: b.impactos || 0 }));
      let resultado = 'agua';
      flota.forEach(barco => {
        if (barco.celdas.includes(coord)) {
          barco.impactos = (barco.impactos || 0) + 1;
          resultado = barco.impactos >= barco.celdas.length ? 'hundido' : 'tocado';
        }
      });
      disparosRecibidos[coord] = resultado;
      const totalCeldas = flota.reduce((s,b) => s + b.celdas.length, 0);
      const totalImpactos = flota.reduce((s,b) => s + (b.impactos||0), 0);
      const gano = totalCeldas > 0 && totalImpactos >= totalCeldas;

      const actualizacion = {
        [disparosKey]: disparosRecibidos,
        [flotaKey]: flota,
        turno: gano ? null : targetLetra,
        ultimoEvento: { tipo: 'disparo', equipoLetra: miEquipo, coord, resultado, ts: TS() }
      };
      if (gano) {
        actualizacion.fase = 'terminada';
        actualizacion.ganador = miEquipo;
      }
      tx.update(partidaRef, actualizacion);
    });
  } catch(e) { console.error(e); }
}

function renderBatalla() {
  const d = ultimaPartida;
  const soyA = miEquipo === 'A';
  const miNombre = soyA ? d.equipoA : d.equipoB;
  const rivalNombre = soyA ? d.equipoB : d.equipoA;
  const miFlota = (soyA ? d.flotaA : d.flotaB) || [];
  const disparosContraMi = (soyA ? d.disparosRecibidosA : d.disparosRecibidosB) || {};
  const disparosQueHago = (soyA ? d.disparosRecibidosB : d.disparosRecibidosA) || {};

  // Sorteo de inicio
  document.getElementById("sorteo-bar").style.display = (!d.turno) ? 'block' : 'none';

  // Banner de turno
  const banner = document.getElementById("turno-banner");
  if (!d.turno) {
    banner.textContent = "Ambas flotas listas — falta sortear quién empieza";
    banner.className = "turno-banner rival";
  } else if (d.turno === miEquipo) {
    banner.textContent = "🎯 ¡Es tu turno! Dispara en el tablero de ataque";
    banner.className = "turno-banner mio";
  } else {
    banner.textContent = `Turno de ${rivalNombre}...`;
    banner.className = "turno-banner rival";
  }

  const misCeldasBarco = new Set(miFlota.flatMap(b => b.celdas));
  document.getElementById("board-flota").innerHTML = renderBoardHTML({
    marcarBarco: (id) => misCeldasBarco.has(id),
    marcarDisparo: (id) => disparosContraMi[id] || null,
    onClickCell: null
  });

  const puedeDisparar = d.fase === 'batalla' && d.turno === miEquipo;
  document.getElementById("board-ataque").innerHTML = renderBoardHTML({
    marcarBarco: null,
    marcarDisparo: (id) => disparosQueHago[id] || null,
    onClickCell: puedeDisparar ? 'disparar' : null
  });
}

function renderEspectador() {
  const d = ultimaPartida;
  document.getElementById("espectador-nombre-a").textContent = "⚓ " + d.equipoA;
  document.getElementById("espectador-nombre-b").textContent = "⚓ " + d.equipoB;

  const banner = document.getElementById("espectador-banner");
  if (d.fase === 'terminada') {
    banner.textContent = `🏆 GANADOR: ${(d.ganador === 'A' ? d.equipoA : d.equipoB).toUpperCase()}`;
    banner.className = "turno-banner mio";
  } else if (d.fase === 'colocacion') {
    banner.textContent = `Colocando flotas... (${d.listoA ? '✓' : '…'} ${d.equipoA} · ${d.listoB ? '✓' : '…'} ${d.equipoB})`;
    banner.className = "turno-banner rival";
  } else if (!d.turno) {
    banner.textContent = "Ambas flotas listas — falta sortear quién empieza";
    banner.className = "turno-banner rival";
  } else {
    const nombreTurno = d.turno === 'A' ? d.equipoA : d.equipoB;
    banner.textContent = `Turno de ${nombreTurno}`;
    banner.className = "turno-banner mio";
  }

  const flotaA = d.flotaA || [];
  const flotaB = d.flotaB || [];
  const celdasA = new Set(flotaA.flatMap(b => b.celdas));
  const celdasB = new Set(flotaB.flatMap(b => b.celdas));
  document.getElementById("board-espectador-a").innerHTML = renderBoardHTML({
    marcarBarco: (id) => celdasA.has(id),
    marcarDisparo: (id) => (d.disparosRecibidosA || {})[id] || null
  });
  document.getElementById("board-espectador-b").innerHTML = renderBoardHTML({
    marcarBarco: (id) => celdasB.has(id),
    marcarDisparo: (id) => (d.disparosRecibidosB || {})[id] || null
  });
}

function renderFin() {
  const d = ultimaPartida;
  const nombreGanador = d.ganador === 'A' ? d.equipoA : d.equipoB;
  document.getElementById("fin-resultado").textContent = `🏆 GANADOR: ${nombreGanador.toUpperCase()}`;
}

/* ===== ANUNCIOS DE VOZ + OVERLAY ===== */
function mostrarOverlayEvento(titulo, texto, ms) {
  const overlay = document.getElementById("overlay-evento");
  document.getElementById("overlay-titulo").textContent = titulo;
  document.getElementById("overlay-texto").textContent = texto;
  overlay.classList.add("show");
  setTimeout(() => overlay.classList.remove("show"), ms || 2600);
}

function anunciarEvento(d) {
  const ev = d.ultimoEvento;
  if (!ev) return;
  if (ev.tipo === 'inicio') {
    const nombre = ev.equipoLetra === 'A' ? d.equipoA : d.equipoB;
    hablar([`Empieza el equipo ${nombre}`]);
    mostrarOverlayEvento("SORTEO", `EMPIEZA ${nombre.toUpperCase()}`);
  } else if (ev.tipo === 'disparo') {
    const nombre = ev.equipoLetra === 'A' ? d.equipoA : d.equipoB;
    const resultadoTexto = ev.resultado === 'agua' ? 'Agua' : ev.resultado === 'tocado' ? 'Tocado' : 'Hundido';
    hablar([`Equipo ${nombre} lanza ${ev.coord}`, resultadoTexto]);
    mostrarOverlayEvento(`${nombre.toUpperCase()} LANZA ${ev.coord}`, resultadoTexto.toUpperCase());
  }
  if (d.fase === 'terminada' && d.ganador) {
    const nombreGanador = d.ganador === 'A' ? d.equipoA : d.equipoB;
    setTimeout(() => {
      hablar([`Equipo ${nombreGanador}`, "GANADOR"]);
    }, 2200);
  }
}

/* ===== RENDER PRINCIPAL SEGÚN ESTADO ===== */
function renderTodo() {
  const d = ultimaPartida;
  if (!d) { mostrarPantalla('pantalla-config'); return; }

  if (modoEspectador) {
    renderEspectador();
    mostrarPantalla('pantalla-espectador');
    return;
  }

  if (!miEquipo) {
    document.getElementById("btn-elegir-a").textContent = "Soy Capitán " + d.equipoA;
    document.getElementById("btn-elegir-b").textContent = "Soy Capitán " + d.equipoB;
    mostrarPantalla('pantalla-seleccion');
    return;
  }

  if (d.fase === 'colocacion') {
    const yaListo = miEquipo === 'A' ? d.listoA : d.listoB;
    document.getElementById("colocacion-titulo").textContent = "Coloca tu flota — " + (miEquipo === 'A' ? d.equipoA : d.equipoB);
    if (yaListo) {
      document.getElementById("colocacion-espera").style.display = 'block';
      document.getElementById("board-colocacion").innerHTML = renderBoardHTML({
        marcarBarco: (id) => new Set((miEquipo === 'A' ? d.flotaA : d.flotaB).flatMap(b=>b.celdas)).has(id)
      });
      document.getElementById("btn-confirmar-flota").style.display = 'none';
    } else {
      document.getElementById("colocacion-espera").style.display = 'none';
      renderColocacion();
    }
    mostrarPantalla('pantalla-colocacion');
    return;
  }

  if (d.fase === 'batalla') {
    renderBatalla();
    mostrarPantalla('pantalla-batalla');
    return;
  }

  if (d.fase === 'terminada') {
    renderFin();
    mostrarPantalla('pantalla-fin');
    return;
  }
}

/* ===== LISTENER PRINCIPAL ===== */
partidaRef.onSnapshot(snap => {
  if (!snap.exists) { ultimaPartida = null; renderTodo(); return; }
  const d = snap.data();
  ultimaPartida = d;

  // Transición automática de colocación -> batalla cuando ambos están listos
  // (el espectador solo mira, no escribe en la partida)
  if (!modoEspectador && d.fase === 'colocacion' && d.listoA && d.listoB && !yaTransicionoFase) {
    yaTransicionoFase = true;
    partidaRef.update({ fase: 'batalla' }).catch(e => console.error(e));
  }
  if (d.fase !== 'colocacion') yaTransicionoFase = (d.fase !== 'colocacion');

  // Anuncios de voz: se ignora el primer snapshot (carga/recarga de página) y
  // los que aún no están confirmados por el servidor (evita doble aviso).
  const esPrimerSnap = primerSnapPartida;
  primerSnapPartida = false;
  // La voz sale SOLO del modo espectador (esa es la pantalla/PC conectada a
  // la megafonía). Los portátiles de los capitanes no anuncian nada, para no
  // duplicar el audio ni depender de que tengan altavoces.
  if (modoEspectador && !esPrimerSnap && !snap.metadata.hasPendingWrites && d.ultimoEvento) {
    const clave = JSON.stringify([d.ultimoEvento.tipo, d.ultimoEvento.equipoLetra, d.ultimoEvento.coord, d.ultimoEvento.resultado]);
    if (clave !== ultimoEventoKey) {
      ultimoEventoKey = clave;
      anunciarEvento(d);
    }
  }

  renderTodo();
});

initVoz();
</script>
